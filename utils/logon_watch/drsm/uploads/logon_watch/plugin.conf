# DRSM plugin manifest, see PLUGINS.md "Hook uploads"
# Copy this folder to <drsm>/plugins/uploads/logon_watch on the monitor
# host; hook.php reads it from [hooks] manifest_dir.
NAME=logon_watch
CATEGORY=uploads
DESCRIPTION="Failed logons and lockouts (utils/logon_watch), remote apart from the computer's own"
PLATFORMS="any"
MODE=probe
TIMEOUT=60
REQUIRES="awk"
NEEDS_SUDO=no

# Read by hook.php on the report server
# logon_watch.ps1 -Submit sends DRSM lines: DETAIL values for the rules
# (remote_failed, remote_invalid_user, remote_lockouts, local_failed,
# ...) and the same table as its CSV output (UPLOAD columns/row lines).
# The csv format would only give the rules a row count.
FORMAT=drsm-lines
MAX_BYTES=2000000
KEEP_HISTORY=24
MIN_INTERVAL_SECONDS=10

# Settings, override per host with uploads_logon_watch_<SETTING>=value
TITLE="Logon failures"
PLACE=host-section
DISPLAY=table
# logon_watch runs from a scheduled task every 15 minutes: old data
# means it stopped
MAX_AGE_HOURS=2
# Only remote attempts and lockouts alert: localhost and local typos
# are in the table but not in these values. A cleared Security log is
# an error.
CRIT_IF="remote_failed >= 50 or log_cleared > 0"
WARN_IF="remote_failed > 0 or remote_invalid_user > 0 or remote_too_many > 0 or remote_lockouts > 0 or local_lockouts > 0"
METRICS="remote_failed remote_invalid_user remote_sources remote_lockouts local_failed"
MAX_LINES=1000
