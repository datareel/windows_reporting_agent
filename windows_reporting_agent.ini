; Windows Reporting Agent settings
;
; Place this file in the same directory as windows_reporting_agent_svc.exe
; and send_test_report.exe. The service re-reads it before every report,
; so changes take effect on the next cycle without a restart. Any setting
; left out uses the default shown here.

[delivery]
; How to deliver the report. List one or more, separated by commas.
; Every listed method runs each cycle.
;   https - POST to the upload page on a web server (see php/upload.php)
;   cifs  - copy to a Windows (SMB/CIFS) file share
;   scp   - copy over SSH with the Windows OpenSSH client
methods=https

[https]
; Report server that receives the uploads
host=reports.example.com
; 443 for HTTPS, 80 for HTTP
port=443
; Upload script on the report server (see php/upload.php)
upload_path=/windows/upload/upload.php
; Registration script. The agent registers its certificate here before it
; sends any report, and only uploads once the server has approved it.
register_path=/windows/upload/register.php
; Shared secret from enrollment_token in the server's server.ini. With the
; right token the agent is approved automatically. Leave empty to have an
; admin approve each agent on admin.php instead.
enrollment_token=
; 1 = HTTPS, 0 = plain HTTP
use_https=1
; 1 = skip the certificate revocation (CRL/OCSP) check. Useful on networks
; that block CRL servers (WinINet error 12057). Set to 0 to enforce it.
ignore_cert_revocation=1

[cifs]
; UNC path of the share, for example \\fileserver\reports
; The service runs as LocalSystem, so on a domain it connects as the
; computer account (DOMAIN\HOSTNAME$). Give that account, or the
; Domain Computers group, write access to the share and folder.
share=

[scp]
; SSH server and account that receive the report
host=
port=22
user=
; Private key with no passphrase. Restrict the file to SYSTEM and
; Administrators, for example:
;   icacls key_file /inheritance:r /grant SYSTEM:F /grant Administrators:F
key_file=C:\ProgramData\WindowsReportAgent\id_ed25519
; Directory on the server, for example /var/www/html/windows/reports
remote_dir=
; known_hosts file for the server's host key. Leave empty to use the
; SYSTEM account's default (C:\Windows\System32\config\systemprofile\.ssh)
known_hosts_file=C:\ProgramData\WindowsReportAgent\known_hosts
; yes        = only connect to a host key already in known_hosts (safest)
; accept-new = save the host key on the first connection, then require it
strict_host_key_checking=yes
; Path to scp.exe (environment variables are expanded)
scp_path=%SystemRoot%\System32\OpenSSH\scp.exe
; Seconds before a hung transfer is stopped
timeout_seconds=120

[agent]
; Minutes between reports
report_interval_minutes=45
; Directory where the report file is written before upload. The installer
; limits C:\ProgramData\WindowsReportAgent to SYSTEM and Administrators.
report_dir=C:\ProgramData\WindowsReportAgent
; Log file for the last upload result, including the agent key fingerprint
log_file=C:\ProgramData\WindowsReportAgent\windows_report_agent.log
; Directory listed in the USERS section of the report
users_dir=C:\Users
; Days of Windows Defender alerts to include
event_lookback_days=30
; Agent certificate (agent_cert.pem) and registration state. The private
; key stays in the Windows machine key store and cannot be exported.
; The key fingerprint to check before approving is in the log file.
data_dir=C:\ProgramData\WindowsReportAgent
